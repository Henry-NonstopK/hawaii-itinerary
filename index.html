<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hong's 햅삐한 하와이여행</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap");
    :root {
      color-scheme: light;
      --ink: #1d2330;
      --muted: #5b6474;
      --line: rgba(29, 35, 48, 0.1);
      --paper: #f8fcff;
      --wash: #eaf4fb;
      --aqua: #2a8bb9;
      --aqua-dark: #10253a;
      --lagoon: #56c9d1;
      --coral: #f28e78;
      --hibiscus: #2b78b9;
      --sun: #f2c35a;
      --sand: #e7f1fa;
      --palm: #2f6e75;
      --sunset: #4ba6df;
      --orchid: #5b86d8;
      --sky: #3f97e0;
      --ocean: #0f5e99;
      --tab-pink: #f7c9cf;
      --tab-yellow: #f7f2b6;
      --tab-green: #c8f0c0;
      --tab-cyan: #c8f1ef;
      --tab-blue: #c8dbff;
      --headline: "Outfit", "Noto Sans KR", sans-serif;
      --shadow: 0 22px 54px rgba(24, 38, 45, 0.12);
    }

    * { box-sizing: border-box; }
    html {
      font-size: 16px;
      scroll-behavior: smooth;
      overscroll-behavior: none;
    }
    body {
      margin: 0;
      position: relative;
      font-family: "Outfit", "Noto Sans KR", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      overscroll-behavior: none;
      background:
        linear-gradient(180deg, rgba(247, 251, 255, 0.76), rgba(237, 246, 252, 0.84)),
        url("./assets/hawaii-hero.png") center center / cover no-repeat;
      color: var(--ink);
      line-height: 1.45;
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      background-image: var(--hawaii-bg-url);
      background-repeat: no-repeat;
      background-position: center 42px;
      background-size: min(980px, 92vw);
      opacity: 0.38;
      filter: saturate(1.02) contrast(1);
    }
    body::after {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.22) 0%, rgba(247, 251, 255, 0.48) 44%, rgba(247, 251, 255, 0.72) 100%);
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }

    .shell {
      width: min(100%, 1080px);
      margin: 0 auto;
      padding: 1px 18px 72px;
      position: relative;
      z-index: 1;
    }
    .stack-shell {
      display: grid;
      gap: 16px;
    }
    .top-rail {
      display: grid;
      gap: 12px;
      margin-bottom: 2px;
    }
    .top-menu {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 260;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .menu-toggle {
      position: relative;
      z-index: 261;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      min-height: 42px;
      padding: 0 13px;
      border: 1px solid rgba(24, 38, 45, 0.06);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--aqua-dark);
      box-shadow: 0 8px 18px rgba(24, 38, 45, 0.08);
      backdrop-filter: blur(12px);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.02em;
    }
    .menu-toggle span {
      font-size: 1.05rem;
      line-height: 1;
      margin-right: 6px;
    }
    .view-shell {
      position: relative;
    }
    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 250;
      display: block;
      pointer-events: none;
      opacity: 0;
      transition: opacity 200ms ease;
    }
    .menu-overlay.is-open {
      pointer-events: auto;
      opacity: 1;
    }
    .menu-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 18, 22, 0.52);
      backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 200ms ease;
    }
    .menu-overlay.is-open .menu-backdrop { opacity: 1; }
    .menu-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: clamp(280px, 50vw, 360px);
      height: 100%;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(255, 255, 253, 0.99), rgba(246, 249, 251, 0.98));
      border-left: 1px solid rgba(24, 38, 45, 0.08);
      box-shadow: -22px 0 52px rgba(24, 38, 45, 0.18);
      transform: translateX(100%);
      transition: transform 280ms cubic-bezier(0.22, 1, 0.36, 1);
      display: grid;
      align-content: start;
      gap: 12px;
      overflow: auto;
      overscroll-behavior: contain;
    }
    .menu-overlay.is-open .menu-panel {
      transform: translateX(0);
    }
    .menu-head {
      display: grid;
      gap: 4px;
      padding-top: 38px;
      justify-items: start;
    }
    .menu-head b {
      font-family: var(--headline);
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }
    .menu-head span {
      color: var(--muted);
      font-size: 0.86rem;
    }
    .menu-list {
      display: grid;
      gap: 10px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 42px;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid rgba(24, 38, 45, 0.08);
      background: #f8fcff;
      color: var(--aqua-dark);
      box-shadow: 0 8px 18px rgba(24, 38, 45, 0.06);
      font-size: 0.88rem;
      font-weight: 900;
      text-align: left;
      width: 100%;
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease, background 140ms ease;
    }
    .menu-label {
      flex: 1 1 auto;
      min-width: 0;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .menu-list > :nth-child(6n + 1) {
      background: linear-gradient(135deg, #f8e8f1, #fff7fb);
      border-color: rgba(237, 184, 208, 0.72);
    }
    .menu-list > :nth-child(6n + 2) {
      background: linear-gradient(135deg, #e8f3ff, #f8fbff);
      border-color: rgba(180, 211, 244, 0.72);
    }
    .menu-list > :nth-child(6n + 3) {
      background: linear-gradient(135deg, #e7f7ef, #f8fff9);
      border-color: rgba(175, 223, 194, 0.74);
    }
    .menu-list > :nth-child(6n + 4) {
      background: linear-gradient(135deg, #fff3df, #fffaf0);
      border-color: rgba(237, 205, 146, 0.74);
    }
    .menu-list > :nth-child(6n + 5) {
      background: linear-gradient(135deg, #ede6ff, #faf8ff);
      border-color: rgba(195, 183, 241, 0.74);
    }
    .menu-list > :nth-child(6n) {
      background: linear-gradient(135deg, #e3f3f5, #f8fcfd);
      border-color: rgba(170, 220, 226, 0.76);
    }
    .menu-list > :nth-child(6n + 1):hover,
    .menu-list > :nth-child(6n + 2):hover,
    .menu-list > :nth-child(6n + 3):hover,
    .menu-list > :nth-child(6n + 4):hover,
    .menu-list > :nth-child(6n + 5):hover,
    .menu-list > :nth-child(6n):hover {
      transform: translateX(-2px);
      filter: saturate(1.02);
    }
    .menu-item.primary {
      background: linear-gradient(135deg, #0f5e99, #2f7fc0);
      color: #fff;
      border-color: rgba(15, 94, 153, 0.24);
      box-shadow: 0 10px 22px rgba(15, 94, 153, 0.22);
    }
    .hero {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: stretch;
      padding: 4px 4px 8px;
      gap: 8px;
    }
    .hero-copy {
      display: grid;
      gap: 12px;
      padding: 0;
    }

    .hero-banner {
      width: min(100%, 400px);
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
    }

    .hero-banner img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 0;
    }
    .travel-info-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 2px;
    }
    .hero-panel {
      display: grid;
      gap: 12px;
      padding: 16px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(24, 38, 45, 0.08);
      box-shadow: 0 14px 30px rgba(24, 38, 45, 0.07);
      backdrop-filter: blur(16px);
    }
    .hero-search {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(42, 139, 185, 0.18);
      background: linear-gradient(180deg, #ffffff, #f4fbff);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }
    .hero-search-mark {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #0f5e99;
      color: #fff;
      font-family: var(--headline);
      font-size: 0.98rem;
      font-weight: 900;
    }
    .hero-search-pill {
      min-width: 0;
      display: grid;
      gap: 2px;
    }
    .hero-search-pill strong {
      font-size: 0.92rem;
      color: var(--aqua-dark);
      letter-spacing: -0.02em;
    }
    .hero-search-pill span {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
    }
    .hero-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .hero-summary-card {
      display: grid;
      gap: 4px;
      padding: 12px 12px 10px;
      border-radius: 20px;
      border: 1px solid rgba(24, 38, 45, 0.08);
      background: #ffffff;
      box-shadow: 0 8px 18px rgba(24, 38, 45, 0.05);
    }
    .hero-summary-card b {
      color: var(--ocean);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .hero-summary-card span {
      color: var(--aqua-dark);
      font-size: 0.9rem;
      font-weight: 900;
    }
    .hero-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.45;
    }
    .splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(247, 251, 255, 0.94);
      backdrop-filter: blur(18px);
      animation: splashFadeOut 260ms ease forwards;
      animation-delay: 1.12s;
      pointer-events: none;
    }
    .splash-card {
      width: min(100%, 390px);
      padding: 24px 22px 22px;
      border-radius: 32px;
      background: rgba(255, 255, 253, 0.94);
      border: 1px solid rgba(24, 38, 45, 0.08);
      box-shadow: 0 22px 60px rgba(24, 38, 45, 0.16);
      text-align: center;
      transform-origin: center;
      animation: splashRise 780ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .splash-mark {
      width: 74px;
      height: 74px;
      margin: 0 auto 14px;
      border-radius: 24px 24px 12px 12px;
      background:
        radial-gradient(circle at 50% 34%, rgba(255, 255, 255, 0.9) 0 16%, transparent 17%),
        linear-gradient(135deg, #0f5e99 0%, #2a8bb9 44%, #56c9d1 100%);
      box-shadow: 0 14px 28px rgba(24, 38, 45, 0.12);
      position: relative;
      overflow: hidden;
    }
    .splash-mark::before,
    .splash-mark::after {
      content: "";
      position: absolute;
      inset: auto auto 10px 50%;
      width: 120px;
      height: 28px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: rgba(255, 255, 253, 0.78);
    }
    .splash-mark::after {
      inset: auto auto 0 50%;
      width: 92px;
      height: 22px;
      background: rgba(18, 39, 58, 0.3);
    }
    .splash-kicker {
      margin: 0 0 8px;
      color: var(--ocean);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .splash h2 {
      margin: 0;
      color: var(--aqua-dark);
      font-family: var(--headline);
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 800;
      line-height: 0.94;
      letter-spacing: -0.04em;
    }
    .splash p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .splash-bar {
      width: min(160px, 52%);
      height: 6px;
      margin: 18px auto 0;
      border-radius: 999px;
      background: rgba(24, 38, 45, 0.08);
      overflow: hidden;
    }
    .splash-bar::before {
      content: "";
      display: block;
      width: 44%;
      height: 100%;
      border-radius: inherit;
      background: #2a8bb9;
      animation: splashBar 1.05s ease-in-out infinite;
    }
    @keyframes splashRise {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    @keyframes splashFadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
    @keyframes splashBar {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(122%); }
    }
    .eyebrow {
      margin: 0;
      color: var(--ocean);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .hero-title {
      margin: 0;
      display: grid;
      gap: 8px;
      text-wrap: balance;
    }
    .hero-title .title-kicker {
      color: var(--aqua-dark);
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .hero-title .title-main {
      max-width: 9ch;
      color: var(--aqua-dark);
      font-family: var(--headline);
      font-size: clamp(2.3rem, 9vw, 4.6rem);
      font-weight: 800;
      line-height: 0.94;
      letter-spacing: -0.04em;
    }
    .hero-title .title-sub {
      display: block;
      color: var(--ink);
      font-size: clamp(1.7rem, 6vw, 2.4rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      overflow-wrap: anywhere;
    }
    .quick-facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 0;
    }
    .fact {
      min-height: 62px;
      padding: 10px 11px 10px;
      border: 1px solid rgba(36, 56, 67, 0.08);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 253, 0.98), rgba(242, 244, 241, 0.94));
      box-shadow: 0 8px 18px rgba(24, 38, 45, 0.06);
      backdrop-filter: blur(10px);
      overflow-wrap: anywhere;
    }
    .fact b {
      display: block;
      margin-bottom: 3px;
      color: var(--aqua-dark);
      font-size: 0.7rem;
      font-weight: 800;
    }
    .fact span { font-size: 0.84rem; font-weight: 800; }
    .hero-meta-note {
      padding: 11px 13px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(242, 118, 91, 0.1), rgba(241, 184, 93, 0.12), rgba(156, 207, 201, 0.12));
      border: 1px solid rgba(24, 38, 45, 0.08);
      color: var(--aqua-dark);
      font-size: 0.84rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .tabbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
      overflow: visible;
      margin: 0 -12px 12px;
      padding: 8px 12px 9px;
      background: rgba(247, 251, 255, 0.96);
      border-block: 1px solid rgba(36, 56, 67, 0.06);
      box-shadow: 0 6px 14px rgba(24, 38, 45, 0.05);
      backdrop-filter: saturate(140%) blur(10px);
    }
    .tabbar::after {
      content: none;
    }
    .tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 40px;
      padding: 8px 6px;
      border: 1px solid rgba(36, 56, 67, 0.1);
      border-radius: 999px;
      background: #ffffff;
      color: var(--aqua-dark);
      font-size: 0.68rem;
      font-weight: 800;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
      box-shadow: 0 9px 20px rgba(24, 38, 45, 0.08);
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
    }
    .tabbar .tab:nth-child(1),
    .tabbar .tab:nth-child(6) {
      background: var(--tab-green);
      border-color: rgba(196, 230, 181, 0.92);
    }
    .tabbar .tab:nth-child(2),
    .tabbar .tab:nth-child(7) {
      background: var(--tab-yellow);
      border-color: rgba(235, 229, 166, 0.9);
    }
    .tabbar .tab:nth-child(3) {
      background: var(--tab-cyan);
      border-color: rgba(180, 231, 228, 0.92);
    }
    .tabbar .tab:nth-child(4) {
      background: var(--tab-blue);
      border-color: rgba(189, 207, 245, 0.92);
    }
    .tabbar .tab:nth-child(5) {
      background: var(--tab-pink);
      border-color: rgba(240, 192, 199, 0.88);
    }
    .tab:hover {
      transform: translateY(-1px);
      filter: brightness(0.99);
    }
    .tab.active {
      transform: translateY(-1px);
      box-shadow: 0 11px 24px rgba(24, 38, 45, 0.14);
      filter: saturate(1.02);
    }
    .section-title {
      margin: 6px 4px 10px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0;
    }
    .section-kicker {
      margin: -2px 4px 12px;
      color: var(--muted);
      font-size: 0.88rem;
      overflow-wrap: anywhere;
    }
    .tab-page {
      display: grid;
      gap: 14px;
      padding: 16px;
      border: 1px solid rgba(24, 38, 45, 0.08);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 16px 34px rgba(24, 38, 45, 0.08);
      backdrop-filter: blur(14px);
    }
    .tab-page .section-title {
      margin: 0 2px 2px;
    }
    .tab-page .section-kicker {
      margin: -6px 2px 0;
    }
    .schedule-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 2px;
    }
    .schedule-head-copy {
      display: grid;
      gap: 4px;
    }
    .schedule-head-copy .section-title {
      margin: 0;
    }
    .schedule-head-copy .section-kicker {
      margin: 0;
    }
    .schedule-edit-button {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 10px 14px;
      border-radius: 16px;
      border: 1px solid rgba(15, 94, 153, 0.22);
      background: #0f5e99;
      color: #fff;
      font-size: 0.84rem;
      font-weight: 900;
      box-shadow: 0 10px 20px rgba(15, 94, 153, 0.18);
    }

    .toolbar {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      margin: 0 -14px 14px;
      padding: 10px 14px 12px;
      background: rgba(247, 251, 255, 0.96);
      border-block: 1px solid rgba(36, 56, 67, 0.08);
      scrollbar-width: none;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .toolbar::-webkit-scrollbar { display: none; }
    .schedule-rail {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid rgba(24, 38, 45, 0.08);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 12px 28px rgba(24, 38, 45, 0.06);
    }
    .schedule-rail .toolbar {
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .chip {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid rgba(36, 56, 67, 0.1);
      border-radius: 999px;
      background: #ffffff;
      color: var(--aqua-dark);
      font-size: 0.92rem;
      font-weight: 850;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(24, 38, 45, 0.05);
      transition: transform 140ms ease, box-shadow 140ms ease;
    }
    .chip.active {
      background: #2a8bb9;
      color: #fff;
      border-color: rgba(42, 139, 185, 0.34);
    }

    .card, .day-card, .panel, .post, .chat-login, .chat-phone, .gallery-shell {
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(24, 38, 45, 0.08);
      box-shadow: 0 14px 32px rgba(24, 38, 45, 0.08);
      backdrop-filter: blur(12px);
    }
    .day-card { margin-bottom: 16px; padding: 16px; }
    .day-card {
      position: relative;
      overflow: hidden;
      background:
        rgba(255, 255, 255, 0.98);
    }
    .schedule-swipe-hint {
      display: flex;

      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));

      border: 1px solid rgba(24, 38, 45, 0.08);
      box-shadow: 0 -16px 44px rgba(24, 38, 45, 0.16);

      from {
        opacity: 0;
        transform: translateY(24px);

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes sheetDrop {
      from {
        opacity: 1;
        transform: translateY(0);

      to {
        opacity: 0;
        transform: translateY(24px);
      }
    }
    @keyframes sheetOverlayIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes sheetOverlayOut {
      from { opacity: 1; }
      to { opacity: 0; }

    function mapUrl(query) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;

    function renderExternalText(value) {
      const text = String(value || "");
      const tokenPattern = /<(https?:\/\/[^>|]+)(?:\|([^>]+))?>|https?:\/\/[^\s<>"')\]]+/gi;
      const parts = [];
      let lastIndex = 0;
      let match;
      while ((match = tokenPattern.exec(text)) !== null) {
        if (match.index > lastIndex) {
          parts.push(text.slice(lastIndex, match.index));
        }
        const href = match[1] || match[0];
        const label = match[2] || href;
        parts.push(React.createElement("a", {
          href,
          target: "_blank",
          rel: "noopener noreferrer",
          key: `${match.index}-${href}`
        }, label));
        lastIndex = match.index + match[0].length;
      }
      if (!parts.length) return value;
      if (lastIndex < text.length) {
        parts.push(text.slice(lastIndex));
      }
      return parts;
    }

    function readSessionFlag(key) {
      try {
        return window.sessionStorage.getItem(key) === "1";

        return false;

    }

    function writeSessionFlag(key) {
      try {
        window.sessionStorage.setItem(key, "1");
      } catch {
        return false;
      }
      return true;
    }

    function formatBytes(bytes) {
      if (!bytes) return "0 KB";
      const units = ["B", "KB", "MB", "GB"];
      const index = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
      const value = bytes / (1024 ** index);
      return `${value >= 10 || index === 0 ? Math.round(value) : value.toFixed(1)} ${units[index]}`;
    }

    function readStoredValue(key, fallback = "") {
      try {
        return window.localStorage.getItem(key) ?? fallback;
      } catch {
        return fallback;
      }
    }

    function writeStoredValue(key, value) {
      try {
        if (!value) {
          window.localStorage.removeItem(key);
        } else {
          window.localStorage.setItem(key, value);
        }
      } catch {
        return false;
      }
      return true;
    }

    function normalizeAnalysisText(text) {
      return String(text || "")
        .replace(/\r/g, "\n")
        .replace(/[ \t]+/g, " ")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }

    function extractEnglishOcrText(text) {
      return String(text || "")
        .toLowerCase()
        .match(/[0-9a-z]+(?:'[0-9a-z]+)?/g)?.join(" ") || "";
    }

    function normalizeOcrStabilityText(text) {
      return extractEnglishOcrText(text).replace(/\s+/g, "");
    }

    function extractOcrTokens(text) {
      return String(text || "")
        .toLowerCase()
        .match(/[0-9a-z]+(?:'[0-9a-z]+)?/g) || [];
    }

    function isSimilarOcrText(previousText, nextText) {
      const previous = normalizeOcrStabilityText(previousText);
      const next = normalizeOcrStabilityText(nextText);
      if (!previous || !next) return false;
      if (previous === next) return true;
      if ((previous.includes(next) || next.includes(previous)) && Math.min(previous.length, next.length) >= 8) {
        return true;
      }

      const previousTokens = extractOcrTokens(previousText);
      const nextTokens = extractOcrTokens(nextText);
      if (!previousTokens.length || !nextTokens.length) return false;

      const previousSet = new Set(previousTokens);
      const nextSet = new Set(nextTokens);
      let shared = 0;
      for (const token of previousSet) {
        if (nextSet.has(token)) shared += 1;
      }

      const overlap = shared / Math.max(previousSet.size, nextSet.size);
      const previousLength = previousTokens.join("").length;
      const nextLength = nextTokens.join("").length;
      const lengthGap = Math.abs(previousLength - nextLength) / Math.max(previousLength, nextLength);
      return overlap >= 0.6 || (overlap >= 0.4 && lengthGap <= 0.35);
    }

    function detectTextScript(text) {
      const value = String(text || "");
      const latinCount = (value.match(/[A-Za-z]/g) || []).length;
      if (latinCount === 0) return "unknown";
      return "en";
    }

    async function loadTesseractModule() {
      if (!tesseractModulePromise) {
        tesseractModulePromise = import("https://esm.sh/tesseract.js@5.1.0");
      }
      return tesseractModulePromise;

    async function createOcrWorker(onProgress) {
      const Tesseract = await loadTesseractModule();
      const worker = await Tesseract.createWorker("eng", 1, {
        logger: (message) => {
          if (!onProgress) return;
          if (message?.status) {
            onProgress({
              step: message.status,
              progress: typeof message.progress === "number" ? Math.round(message.progress * 100) : null
            });
          }
        }
      });

      await worker.setParameters({ preserve_interword_spaces: "1" });
      return worker;
    }

    async function analyzeImageText(imageSrc, onProgress) {
      const worker = await createOcrWorker(onProgress);

      try {
        const result = await worker.recognize(imageSrc);
        return result?.data || {};
      } finally {
        await worker.terminate();
      }
    }

    async function translateWithGoogleTranslate(text, source, target) {
      const url = new URL("https://translate.googleapis.com/translate_a/single");
      url.searchParams.set("client", "gtx");
      url.searchParams.set("sl", source || "auto");
      url.searchParams.set("tl", target);
      url.searchParams.set("dt", "t");
      url.searchParams.set("q", text);

      const res = await fetch(url.toString(), {
        method: "GET"
      });
      if (!res.ok) {
        throw new Error("Google 번역이 응답하지 않았어요.");
      }
      const data = await res.json().catch(() => null);
      const translatedText = Array.isArray(data?.[0])
        ? data[0].map((part) => part?.[0] || "").join("")
        : "";
      return {
        translatedText,
        detectedLanguage: data?.[2] || "",
        confidence: null
      };
    }

    async function translateText(text, target, { source = "auto" } = {}) {
      return translateWithGoogleTranslate(text, source, target);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error("파일을 읽을 수 없어요."));
        reader.readAsDataURL(file);
      });
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("이미지를 불러오지 못했어요."));
        image.src = src;
      });
    }

    async function compressImage(file, { maxSide = 3200, targetBytes = PHOTO_MAX_UPLOAD_BYTES } = {}) {
      const dataUrl = await readFileAsDataUrl(file);
      const image = await loadImage(dataUrl);
      const sourceWidth = image.naturalWidth || image.width;
      const sourceHeight = image.naturalHeight || image.height;
      const sourceLongestSide = Math.max(sourceWidth, sourceHeight);
      let nextMaxSide = sourceLongestSide ? Math.min(maxSide, sourceLongestSide) : maxSide;
      let quality = 0.92;
      let output = {
        dataUrl,
        width: sourceWidth,
        height: sourceHeight
      };

      for (let attempt = 0; attempt < 6; attempt += 1) {
        const scale = sourceLongestSide ? Math.min(1, nextMaxSide / sourceLongestSide) : 1;
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(sourceWidth * scale));
        canvas.height = Math.max(1, Math.round(sourceHeight * scale));
        const context = canvas.getContext("2d");
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
        if (!blob) break;
        output = {
          dataUrl: await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.readAsDataURL(blob);
          }),
          width: canvas.width,
          height: canvas.height,
          blob,
          size: blob.size
        };
        if (blob.size <= targetBytes) {
          return output;
        }
        nextMaxSide = Math.max(1024, Math.round(nextMaxSide * 0.8));
        quality = Math.max(0.55, Number((quality - 0.1).toFixed(2)));
      }

      return output;
    }

    function byNewest(a, b) {

    function byOldest(a, b) {

    function upsertRealtimeRow(current, row, sortRows) {
      const next = current.some((item) => item.id === row.id)
        ? current.map((item) => item.id === row.id ? row : item)
        : [...current, row];
      return next.sort(sortRows);

    function safeJson(value) {
      try {
        return JSON.parse(value);
      } catch {
        return null;
      }
    }

    function readJsonCache(key, fallback) {
      const cached = readStoredValue(key, "");
      if (!cached) return fallback;
      const parsed = safeJson(cached);
      return parsed ?? fallback;
    }

    function writeJsonCache(key, value) {
      writeStoredValue(key, JSON.stringify(value));
    }

    function decodeStateDoc(content, fallback) {
      if (typeof content !== "string" || !content.trim()) return fallback;
      const parsed = safeJson(content);
      return parsed ?? fallback;
    }

    function decodeScheduleStateDoc(content, fallback) {
      const parsed = decodeStateDoc(content, null);
      if (Array.isArray(parsed)) {
        return parsed.map((day, index) => normalizeScheduleDay(day, days[index]?.id || day.id));
      }
      if (!parsed || !Array.isArray(parsed.days)) return fallback;
      return parsed.days.map((day, index) => normalizeScheduleDay(day, days[index]?.id || day.id));
    }

    function decodeInstagramStateDoc(content, fallback) {
      const parsed = decodeStateDoc(content, null);
      if (Array.isArray(parsed)) {
        return parsed.map(normalizeInstagramPost).sort(byNewest);
      }
      if (!parsed || !Array.isArray(parsed.posts)) return fallback;
      return parsed.posts.map(normalizeInstagramPost).sort(byNewest);
    }

    function decodeSupplyStateDoc(content, fallback) {
      const parsed = decodeStateDoc(content, null);
      if (Array.isArray(parsed)) {
        return [{
          ...supplySections[0],
          items: parsed.flatMap((section) => (section?.items || [])).map(normalizeSupplyItem)
        }];
      }
      if (!parsed || !Array.isArray(parsed.sections)) return fallback;
      return [{
        ...supplySections[0],
        items: parsed.sections.flatMap((section) => (section?.items || [])).map(normalizeSupplyItem)
      }];
    }

    async function loadLatestStateDoc(title) {
      const { data, error } = await supabase
        .from("posts")
        .select("id, author, title, content, created_at")
        .eq("title", title)
        .order("created_at", { ascending: false })
        .limit(1);

      if (error) throw error;
      return data?.[0] || null;
    }

    function useSharedStateDoc(title, cacheKey, fallbackValue, decode = decodeStateDoc) {
      const [value, setValue] = useState(() => {
        const cached = readJsonCache(cacheKey, null);
        if (cached == null) return fallbackValue;
        const decoded = decode(JSON.stringify(cached), fallbackValue);
        return decoded ?? fallbackValue;
      });
      const [status, setStatus] = useState("ready");
      const [error, setError] = useState("");
      const latestValueRef = useRef(value);
      const seededRef = useRef(false);

      useEffect(() => {
        latestValueRef.current = value;
      }, [value]);

      useEffect(() => {
        let cancelled = false;

        async function refresh({ silent = false } = {}) {
          if (!silent && latestValueRef.current == null) setStatus("loading");
          setError("");

          try {
            const row = await loadLatestStateDoc(title);
            if (cancelled) return null;
            if (!row) {
              setStatus("ready");
              return null;
            }
            const decoded = decode(row.content, latestValueRef.current ?? fallbackValue);
            setValue(decoded);
            writeJsonCache(cacheKey, decoded);
            seededRef.current = true;
            setStatus("ready");
            return decoded;
          } catch (loadError) {
            if (cancelled) return null;
            setError(loadError?.message || "DB 동기화에 실패했어요.");
            setStatus("error");
            return null;
          }
        }

        async function seedIfNeeded() {
          const loaded = await refresh({ silent: false });
          if (cancelled || loaded !== null || seededRef.current) return;
          seededRef.current = true;
          const current = latestValueRef.current ?? fallbackValue;
          writeJsonCache(cacheKey, current);
          await supabase.from("posts").insert({
            author: STATE_DOC_AUTHOR,
            title,
            content: JSON.stringify(current)
          });
        }

        seedIfNeeded();
        const pollId = window.setInterval(() => refresh({ silent: true }), 4000);
        const channel = supabase
          .channel(`${title}-state-realtime`, { config: { broadcast: { self: false } } })
          .on("postgres_changes", { event: "*", schema: "public", table: "posts" }, (payload) => {
            const row = payload.new || payload.old;
            if (!row || row.title !== title) return;
            const decoded = decode(row.content, latestValueRef.current ?? fallbackValue);
            setValue(decoded);
            writeJsonCache(cacheKey, decoded);
            seededRef.current = true;
          })
          .subscribe();

        return () => {
          cancelled = true;
          window.clearInterval(pollId);
          supabase.removeChannel(channel);
        };
      }, [title, cacheKey, fallbackValue, decode]);

      async function save(nextValue) {
        const next = typeof nextValue === "function" ? nextValue(latestValueRef.current ?? fallbackValue) : nextValue;
        latestValueRef.current = next;
        setValue(next);
        writeJsonCache(cacheKey, next);
        setError("");
        const { error: insertError } = await supabase.from("posts").insert({
          author: STATE_DOC_AUTHOR,
          title,
          content: JSON.stringify(next)
        });
        if (insertError) {
          setError(insertError.message);
          setStatus("error");
          return false;
        }
        setStatus("ready");
        return true;
      }

      return { value, setValue, status, error, save, reload: () => loadLatestStateDoc(title) };
    }

    function useSupabaseRows(table, normalizeRow, sortRows, pollMs = 4000) {
      const [items, setItems] = useState([]);
      const [status, setStatus] = useState("loading");
      const [error, setError] = useState("");
      const channelRef = useRef(null);

      useEffect(() => {
        let cancelled = false;

        async function loadRows(showLoading = false) {
          if (showLoading) setStatus("loading");
          setError("");
          const { data, error } = await supabase
            .from(table)
            .select("*")
            .order("created_at", { ascending: sortRows === byOldest });

          if (cancelled) return;
          if (error) {
            setError(error.message);
            setStatus("error");
            return;
          }
          setItems((data || []).map(normalizeRow).sort(sortRows));
          setStatus("ready");
        }

        loadRows(true);
        const pollId = window.setInterval(() => loadRows(false), pollMs);
        const syncLocalRow = (row) => {
          if (!row) return;
          setItems((current) => upsertRealtimeRow(current, normalizeRow(row), sortRows));
        };

        const onStorage = (event) => {
          if (event.key !== CHAT_SYNC_KEY) return;
          const payload = safeJson(event.newValue);
          if (!payload || payload.table !== table) return;
          syncLocalRow(payload.row);
        };
        const onBroadcast = (event) => {
          const payload = event.data;
          if (!payload || payload.table !== table) return;
          syncLocalRow(payload.row);
        };

        window.addEventListener("storage", onStorage);
        chatBroadcast?.addEventListener("message", onBroadcast);

        const channel = supabase
          .channel(`${table}-realtime`, { config: { broadcast: { self: false } } })
          .on("broadcast", { event: "row-change" }, ({ payload }) => {
            if (!payload || payload.table !== table || !payload.row) return;
            setItems((current) => upsertRealtimeRow(current, normalizeRow(payload.row), sortRows));
          })
          .on("postgres_changes", { event: "*", schema: "public", table }, (payload) => {
            setItems((current) => {
              if (payload.eventType === "DELETE") {
                return current.filter((item) => item.id !== payload.old.id);
              }
              return upsertRealtimeRow(current, normalizeRow(payload.new), sortRows);
            });
          })
          .subscribe((state) => {
            if (state === "CHANNEL_ERROR") {
              setError("실시간 연결을 확인해주세요.");
            }
          });
        channelRef.current = channel;

        return () => {
          cancelled = true;
          window.clearInterval(pollId);
          window.removeEventListener("storage", onStorage);
          chatBroadcast?.removeEventListener("message", onBroadcast);
          channelRef.current = null;
          supabase.removeChannel(channel);
        };
      }, [table, normalizeRow, sortRows, pollMs]);

      async function insertRow(row) {
        setError("");
        const { data, error } = await supabase.from(table).insert(row).select("*").single();
        if (error) {
          setError(error.message);
          return false;
        }
        const savedRow = data || row;
        setItems((current) => upsertRealtimeRow(current, normalizeRow(savedRow), sortRows));
        const localPayload = { table, row: savedRow, sentAt: Date.now() };
        chatBroadcast?.postMessage(localPayload);
        localStorage.setItem(CHAT_SYNC_KEY, JSON.stringify(localPayload));
        channelRef.current?.send({
          type: "broadcast",
          event: "row-change",
          payload: { table, row: savedRow }
        });
        return true;
      }

      return { items, status, error, insertRow };
    }

            ),
            React.createElement("input", {
              ref: libraryInputRef,

            }),

              React.createElement("button", { className: "ghost-action", type: "button", onClick: closeComposer }, "닫기")
            )
          )
        ) : null,
        status === "loading" ? React.createElement("div", { className: "empty" }, "게시물을 불러오는 중입니다.") :
        safePosts.length === 0 ? React.createElement("div", { className: "photo-empty" }, "아직 게시물이 없어요. 사진 등록 버튼을 눌러 첫 게시물을 올려보세요.") :
          React.createElement("div", { className: "instagram-feed" },
            safePosts.map((post, index) => React.createElement("article", { className: "instagram-post", key: post.id },
              React.createElement("button", {
                className: "instagram-post-media",
                type: "button",

              },
                React.createElement("img", { src: post.publicUrl, alt: post.title, loading: "lazy" }),
                React.createElement("span", { className: "photo-badge" }, index === 0 ? "최신" : "눌러서 확대")
              ),
            React.createElement("div", { className: "instagram-post-body" },
              React.createElement("div", { className: "instagram-post-head" },
                React.createElement("strong", null, post.title),
                  React.createElement("span", null, post.author)
                ),

                React.createElement("div", { className: "instagram-post-meta" },

                )
              )

    function Chat() {
      const { items: messages, status, error, insertRow } = useSupabaseRows("messages", normalizeMessage, byOldest, 1000);
      const [session, setSession] = useState(() => {
        try {
          return JSON.parse(sessionStorage.getItem(CHAT_SESSION_KEY) || "null");
        } catch {
          return null;
        }
      });
      const [login, setLogin] = useState({ userId: "", password: "", displayName: "" });
      const [content, setContent] = useState("");
      const chatListRef = useRef(null);
      const activeAuthor = session?.displayName || "";

      useEffect(() => {
        const node = chatListRef.current;
        if (node) node.scrollTop = node.scrollHeight;
      }, [messages.length, session]);

      const enterChat = (event) => {
        event.preventDefault();
        const userId = login.userId.trim();
        const password = login.password.trim();
        const displayName = login.displayName.trim();
        if (!userId || !password || !displayName) return;
        const nextSession = {
          userId,
          displayName,
          signedInAt: new Date().toISOString()
        };
        sessionStorage.setItem(CHAT_SESSION_KEY, JSON.stringify(nextSession));
        setSession(nextSession);
        setLogin({ userId: "", password: "", displayName: "" });
      };

      const leaveChat = () => {
        sessionStorage.removeItem(CHAT_SESSION_KEY);
        setSession(null);
        setContent("");
      };

      const submit = async (event) => {
        event.preventDefault();
        if (!session || !content.trim()) return;
        const ok = await insertRow({
          id: crypto.randomUUID(),
          author: session.displayName,
          message: content.trim(),
          created_at: new Date().toISOString()
        });
        if (ok) setContent("");
      };

      if (!session) {
        return React.createElement("section", null,
          React.createElement("h2", { className: "section-title" }, "가족 채팅"),
          React.createElement("form", { className: "chat-login", onSubmit: enterChat },
            React.createElement("div", { className: "login-grid three" },
              React.createElement("input", { placeholder: "아이디", autoComplete: "username", value: login.userId, onChange: (e) => setLogin({ ...login, userId: e.target.value }) }),
              React.createElement("input", { placeholder: "비밀번호", type: "password", autoComplete: "current-password", value: login.password, onChange: (e) => setLogin({ ...login, password: e.target.value }) }),
              React.createElement("input", { placeholder: "채팅 이름", value: login.displayName, onChange: (e) => setLogin({ ...login, displayName: e.target.value }) })
            ),
            React.createElement("button", { className: "primary-action", type: "submit" }, "채팅방 입장")
          )
        );
      }

      return React.createElement("section", null,
        React.createElement("h2", { className: "section-title" }, "가족 채팅"),
        error ? React.createElement("div", { className: "empty" }, `Supabase 오류: ${error}`) : null,
        React.createElement("div", { className: "chat-phone" },
          React.createElement("div", { className: "chat-room-head" },
            React.createElement("div", { className: "chat-room-title" }, "하와이 가족방"),
            React.createElement("div", { className: "chat-room-actions" },
              React.createElement("div", { className: "chat-user" }, session.displayName),
              React.createElement("div", { className: "chat-count" }, `${messages.length} messages`),
              React.createElement("button", { className: "leave-chat", type: "button", onClick: leaveChat }, "나가기")
            )
          ),
          React.createElement("div", { className: "chat-list", ref: chatListRef },
            status === "loading" ? React.createElement("div", { className: "empty" }, "메시지를 불러오는 중입니다.") :
            messages.length === 0 ? React.createElement("div", { className: "empty" }, "아직 메시지가 없습니다.") :
            messages.map((message) => {
              const mine = message.author === activeAuthor;
              return React.createElement("div", { className: `message-row ${mine ? "mine" : ""}`, key: message.id },
                React.createElement("div", { className: "message-author" }, message.author),
                React.createElement("div", { className: "bubble-wrap" },
                  React.createElement("div", { className: "bubble" }, message.content),
                  React.createElement("div", { className: "message-time" }, new Date(message.createdAt).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }))
                )
              );
            })
          ),
          React.createElement("form", { className: "chat-compose", onSubmit: submit },
            React.createElement("input", { value: session.displayName, readOnly: true, "aria-label": "채팅 이름" }),
            React.createElement("textarea", { placeholder: "메시지", value: content, onChange: (e) => setContent(e.target.value) }),
            React.createElement("button", { className: "primary-action chat-send", type: "submit" }, "전송")
          )
        )
      );
    }

    function TravelInfo() {
      return React.createElement("section", { className: "travel-info-shell" },
        React.createElement("h2", { className: "section-title" }, "여행 정보"),
        React.createElement("div", { className: "travel-info-actions" },
          React.createElement("a", {
            className: "map-btn",
            href: EUNAE_GMAP_URL,
            target: "_blank",
            rel: "noopener"
          }, "구글맵 한번에 보기")
        ),
        React.createElement("div", { className: "grid travel-info-grid" },
          travelInfo.map((item) => React.createElement("article", { className: "card", key: `${item.category}-${item.title}` },
            React.createElement("div", { className: "post-meta" },
              React.createElement("span", { className: "category" }, item.category),
              item.day ? React.createElement("span", null, item.day) : null,
              item.phase ? React.createElement("span", null, item.phase) : null,
              React.createElement("span", null, item.location || "Hawaii"),
              item.hours ? React.createElement("span", null, item.hours) : null
            ),
            React.createElement("h3", null, item.title),
            item.address ? React.createElement("a", { className: "map-btn", href: mapUrl(item.address), target: "_blank", rel: "noopener" }, item.address) : null,
            item.info.length ? React.createElement("ul", { className: "checklist" },
              item.info.map((line) => React.createElement("li", { key: line }, renderExternalText(line)))
            ) : null,
            item.links.length ? React.createElement("div", { className: "ai-inline" },
              item.links.map((link) => React.createElement("a", { className: "map-btn", href: link.href, target: "_blank", rel: "noopener", key: link.href }, link.label))
            ) : null
          ))
        )
      );
    }

    function Notes() {
      return React.createElement("section", null,
        React.createElement("h2", { className: "section-title" }, "메모"),
        React.createElement("section", { className: "panel" },
          React.createElement("ul", null,
            React.createElement("li", null, "야외 활동은 오전 중심, 한낮에는 실내나 호텔 휴식으로 둡니다."),
            React.createElement("li", null, "긴 하이킹, 거친 보트, zipline, horseback riding, UTV, 무리한 snorkeling은 일정에서 빼고 여유 시간을 둡니다."),
            React.createElement("li", null, "그늘, 화장실, 물, 주차가 쉬운 장소를 우선하고 일정 변경 여지를 남깁니다.")
          )
        )
      );
    }

    function App() {
      const [showSplash, setShowSplash] = useState(() => !readSessionFlag(SPLASH_SEEN_KEY));
      const [active, setActive] = useState("schedule");
      const [scheduleEditSignal, setScheduleEditSignal] = useState(0);
      const safeActive = tabIds.includes(active) ? active : tabIds[0];
      const splashTimerRef = useRef(null);

      const finishSplash = () => {
        if (!showSplash) return;
        writeSessionFlag(SPLASH_SEEN_KEY);
        setShowSplash(false);
      };

      useEffect(() => {
        if (active !== safeActive) {
          setActive(safeActive);
        }
      }, [active, safeActive]);

      const selectTab = (nextId) => {
        if (!tabIds.includes(nextId) || nextId === safeActive) return;
        setActive(nextId);
      };

      useEffect(() => {
        if (!showSplash) return;
        if (splashTimerRef.current) window.clearTimeout(splashTimerRef.current);
        splashTimerRef.current = window.setTimeout(() => {
          writeSessionFlag(SPLASH_SEEN_KEY);
          setShowSplash(false);
        }, 1450);
        return () => {
          if (splashTimerRef.current) window.clearTimeout(splashTimerRef.current);
        };
      }, [showSplash]);

      return React.createElement(React.Fragment, null,
        showSplash ? React.createElement("div", { className: "splash", role: "presentation", onClick: finishSplash },
          React.createElement("div", { className: "splash-card", role: "dialog", "aria-label": "앱 시작 화면" },
            React.createElement("div", { className: "splash-mark", "aria-hidden": "true" }),
            React.createElement("div", { className: "splash-bar", "aria-hidden": "true" })
          )
        ) : null,
        React.createElement("div", { className: "hero-banner" },
          React.createElement("img", {
            src: "./assets/hawaii-h.png",
            alt: "Hawaii 안내 이미지",
            loading: "eager",
            decoding: "async"
          })
        ),
        React.createElement("main", { className: "shell" },
          React.createElement(NavigationMenu, { active: safeActive, setActive: selectTab }),
          React.createElement("div", { className: "view-shell" }, ({
            schedule: React.createElement(Schedule, { editSignal: scheduleEditSignal }),
            supplies: React.createElement(Supplies),
            maps: React.createElement(TravelInfo),
            stay: React.createElement(StayInfo),
            kongs: React.createElement(KongsInstagram),
          })[safeActive]),
        )
      );
    }

    createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
